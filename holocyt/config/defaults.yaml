# Настройки ГОЛОЦИТа. Значения по умолчанию рассчитаны на HoloMonitor M4
# и менять их для обычной работы не требуется.

segmentation:
  # Минимальная площадь объекта, пикселей. Меньшее считается обломком.
  min_area_px: 500
  # Типичная площадь клетки, пикселей. Используется только для того,
  # чтобы решить, не слиплись ли несколько клеток в один объект.
  typical_area_px: 2600
  # Порог вероятности обученного классификатора пикселей.
  probability_threshold: 0.55
  # Минимальное расстояние между центрами при разделении слипшихся, пикселей.
  min_distance_px: 9
  # Отбрасывать объекты, касающиеся края кадра.
  drop_edge_objects: true

background:
  # Как выбирается порог отсечения слабого сигнала:
  #   fixed    — постоянное значение fixed_threshold (по умолчанию);
  #   adaptive — по уровню шума фона кадра. ЭКСПЕРИМЕНТАЛЬНО: проверка
  #              на реальных данных показала разброс порога по кадрам
  #              0,017…0,090 при нужных 0,04…0,06, потому что в плотной
  #              культуре чистого фона для оценки почти не остаётся;
  #   off      — не отсекать слабый сигнал вовсе.
  mode: fixed
  # Постоянный порог, доли длины волны (при 633 нм это 25 нм разности
  # хода). Значение подобрано по одному эксперименту — woundhealing,
  # где мусор в области царапины имел среднюю фазу около 0,025, а
  # настоящие клетки от 0,086. УНИВЕРСАЛЬНЫМ ПОРОГОМ ДЛЯ M4 НЕ ЯВЛЯЕТСЯ
  # и на другой клеточной линии может потребовать правки.
  fixed_threshold: 0.04
  # Во сколько раз сигнал объекта должен превышать шум фона кадра
  # при mode: adaptive.
  noise_multiple: 4.0
  # Порядок полинома, которым выравнивается дрейф фона.
  flatten_order: 2

export:
  # Разделитель в CSV. Точка с запятой удобна для русского Excel.
  csv_delimiter: ";"
  # Кодировка CSV. utf-8-sig — с меткой порядка байтов, Excel её понимает.
  csv_encoding: utf-8-sig
  # Сохранять рядом с таблицей файл analysis_metadata.json.
  write_metadata: true
  # Разрешение картинок в отчёте, точек на дюйм.
  report_dpi: 150

logging:
  # Уровень журнала: DEBUG, INFO, WARNING, ERROR.
  level: INFO
  # Сколько файлов журнала хранить.
  keep_files: 5

analysis:
  # Зерно генератора случайных чисел. Фиксировано ради воспроизводимости.
  random_seed: 20260920
